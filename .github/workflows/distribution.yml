# The command line distribution as a release artifact (lethenon#196): the zip and the tar.gz of
# installDist, their SHA-256 and SHA-512 files and their signatures by the signing subkey
# (gradle/distribution.gradle), on the GitHub release of every version from 0.5.0 on.
#
# A RELEASE-* tag builds, signs and verifies the files and attaches them to the GitHub release of the
# tag. If that release does not exist yet, it is created as a draft; the maintainer writes the notes
# from CHANGELOG.md and publishes it, as with the Maven Central upload.
#
# The manual run is the rehearsal: the same build, signatures and verification on develop, uploaded as
# a workflow artifact and not as a release. Run it after any change to this file or to
# gradle/distribution.gradle, before a release tag depends on it.
#
# The verification is what a downloader does: the public key is fetched by its fingerprint from a
# keyserver, every signature must be a valid one by the signing subkey, and every checksum must match.
# It fails closed.
#
# Required repository secrets: GPG_PRIVATE_KEY, GPG_PASSPHRASE, GPG_KEY_ID (see publish.yml).

name: Release distribution

on:
  push:
    tags: [ 'RELEASE-*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # README, "Verifying the release signatures"
      PRIMARY_KEY: 5B2FA6B11E298BC09287F423D8C403518C49CA75
      SIGNING_SUBKEY: 6D67F8442A6FCC96BD7C1B5E9FCF7C9710E2BD8D

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build, sign and checksum the distribution
        run: ./gradlew releaseDistribution
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      - name: Verify as a downloader does
        working-directory: build/distributions
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          fetched=no
          for server in hkps://keys.openpgp.org hkps://keyserver.ubuntu.com; do
            if gpg --batch --keyserver "$server" --recv-keys "$PRIMARY_KEY"; then fetched=yes; break; fi
          done
          [ "$fetched" = yes ] || { echo "the public key could not be fetched from a keyserver"; exit 1; }
          archives=(lethenon-*.zip lethenon-*.tar.gz)
          [ "${#archives[@]}" -eq 2 ] || { echo "expected 2 archives, found ${#archives[@]}"; exit 1; }
          for archive in "${archives[@]}"; do
            gpg --batch --status-fd 1 --verify "$archive.asc" "$archive" > "$RUNNER_TEMP/verify.out"
            grep -q "^\[GNUPG:\] VALIDSIG $SIGNING_SUBKEY .* $PRIMARY_KEY$" "$RUNNER_TEMP/verify.out" \
              || { cat "$RUNNER_TEMP/verify.out"; echo "$archive is not signed by the signing subkey"; exit 1; }
            sha256sum -c "$archive.sha256"
            sha512sum -c "$archive.sha512"
            echo "$archive: signature by $SIGNING_SUBKEY, SHA-256 and SHA-512 match"
          done
          ls -l
      - name: Keep the rehearsal's files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lethenon-distribution
          path: build/distributions/lethenon-*
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/RELEASE-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --draft --verify-tag --title "lethenon ${tag#RELEASE-}" \
              --notes "Draft created by the distribution workflow; the notes come from CHANGELOG.md."
          fi
          gh release upload "$tag" build/distributions/lethenon-* --clobber
          gh release view "$tag" --json assets --jq '.assets[].name'
