# The gate. It runs on every push and every pull request, and it is the only one: the Travis
# configuration that stood here was written in 2021 for OpenJDK 11, travis-ci.com stopped building
# this repository years ago, and the readme carried a build badge for it that had not been true
# since.
name: Java CI with Gradle

on:
  # consensus/**: an integration branch that collects one consensus break before it reaches develop
  # (#138); it is protected like develop, so its required checks have to run on it too
  push:
    branches: [ master, develop, "consensus/**" ]
  pull_request:
    branches: [ master, develop, "consensus/**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Build
        run: ./gradlew build
      # what a failed test said, kept: the XML holds each test's standard output, which the log does
      # not show, and a rerun replaces it (#237)
      - name: Keep the test results of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test-results/test
            build/reports/tests
          if-no-files-found: ignore
