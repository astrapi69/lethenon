/*
 * The build of the Lethenon chain.
 *
 * Deliberately small. What stood here was the 2021 java-library-template: Gradle 6.8.1 against a
 * JDK that did not exist yet, jcenter as a repository after it was shut down, and a publishing and
 * signing block for an artifact that has never been published. It did not build at all - "Unsupported
 * class file major version 69" before it read a single source file.
 *
 * Publishing and signing came back with lethenon#30, when there was something to publish: the
 * library, for the milestone 5 plugin (gradle/publishing.gradle). Coverage and the license plugin
 * come back when there is something to cover. A build that carries a release path nobody has run is
 * the shape the sibling project paid for at its 8.6 release (mystic-crypt-ui#431), so the snapshot
 * path is run once before anything depends on it.
 */
plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'signing'
    id 'com.gradleup.nmcp' version '1.6.2'
}

group = "$groupPackage"
version = "$projectVersion"
description = "$projectDescription"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    // The local repository only when asked for. Checking a consumer against a candidate before it
    // is published is a real job - a published version cannot be replaced - but it is one job, and
    // anything in ~/.m2 otherwise wins over Central silently: a snapshot published hours ago
    // becomes what the build compiles against, on that machine and nowhere else. It cost a red
    // develop that was not red (mystic-crypt-ui#475), so the job names itself on the command line:
    //   ./gradlew build -PuseMavenLocal
    if (providers.gradleProperty('useMavenLocal').isPresent()) {
        mavenLocal()
    }
    mavenCentral()
}

dependencies {
    // The chain consumes this family's own cryptography rather than reaching past it into the
    // platform. That is the point of the teaching chain in the first place (issue #1): primitives
    // that cannot carry a chain are not primitives, and the only way to find that out is to use
    // them. Where the library has no answer, the gap is reported there rather than worked around
    // here.
    implementation "io.github.astrapi69:mystic-crypt:$mysticCryptVersion"
    // declared although mystic-crypt brings it: the algorithm names and the hash algorithm are
    // used here directly, and a dependency that is used is a dependency that is named
    implementation "io.github.astrapi69:crypt-api:$cryptApiVersion"
    implementation "io.github.astrapi69:crypt-data:$cryptDataVersion"
    // the command line (lethenon#2, milestone 4) - the version mystic-crypt's own CLI uses, so the
    // family runs one picocli. Declared directly because it is used directly
    implementation "info.picocli:picocli:$picocliVersion"
    // the chain on disk (#202, ADR 0006): SQLite, for transactions that survive a killed process and
    // a power cut. Not a family library: storage is not what the family offers, and the ADR records
    // why this engine and this binding
    implementation "org.xerial:sqlite-jdbc:$sqliteJdbcVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

application {
    mainClass = 'io.github.astrapi69.lethenon.cli.LethenonCli'
    // sqlite-jdbc loads its native library with System::load, which JDK 25 allows with a warning
    // on every start unless the program says it means to (ADR 0006)
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

// the version --version prints, from projectVersion (#193)
tasks.named('processResources', ProcessResources) {
    def projectVersion = version.toString()
    inputs.property('projectVersion', projectVersion)
    filesMatching('**/cli/version.properties') {
        expand(version: projectVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    // what --version has to print, LethenonCliTest (#193)
    systemProperty 'lethenon.projectVersion', version
    // the crash tests of #202 run 25 times each by default; the gate before a release runs them a
    // thousand times with -PcrashRuns=1000
    def crashRuns = findProperty('crashRuns')
    if (crashRuns != null) {
        systemProperty 'lethenon.crashRuns', crashRuns
    }
}

/**
 * What ran, printed on success as well as on failure - the sibling project's rule: "0 findings" and
 * "0 files scanned" must not print the same green. While this project has no tests yet, this says so
 * out loud instead of letting an empty suite read as a passing one.
 */
tasks.register('testSummary') {
    def resultDir = layout.buildDirectory.dir('test-results/test')
    doLast {
        def files = resultDir.get().asFile.listFiles({ f -> f.name.startsWith('TEST-') && f.name.endsWith('.xml') } as FileFilter)
        if (files == null || files.length == 0) {
            println 'test: no test classes - the build compiles, it verifies nothing yet'
            return
        }
        int tests = 0, failures = 0, errors = 0, skipped = 0
        files.each { file ->
            def suite = new groovy.xml.XmlSlurper().parse(file)
            tests += (suite.@tests.toString() ?: '0') as int
            failures += (suite.@failures.toString() ?: '0') as int
            errors += (suite.@errors.toString() ?: '0') as int
            skipped += (suite.@skipped.toString() ?: '0') as int
        }
        println "test: ${files.length} classes, ${tests} tests, ${failures} failures, ${errors} errors, ${skipped} skipped"
    }
}

test.finalizedBy tasks.named('testSummary')

/**
 * Writes src/test/resources/chain again - after an encoding change (lethenon#23) or a change of the
 * chain identifier (#137), the only reasons the fixtures change. Fresh keys every run; no private key
 * is written. chain-lethenon-1.lethenon is not written here: it is the evidence that an earlier
 * build's chain is refused.
 */
tasks.register('writeChainFixtures', JavaExec) {
    description = 'Regenerates the chain fixtures in src/test/resources/chain'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.astrapi69.lethenon.ChainFixtureWriter'
    args layout.projectDirectory.dir('src/test/resources/chain').asFile.path
}

apply from: "gradle/publishing.gradle"
apply from: "gradle/distribution.gradle"
